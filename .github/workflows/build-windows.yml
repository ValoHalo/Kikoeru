name: Build Windows and Linux x64

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify release tag matches product version
        if: startsWith(github.ref, 'refs/tags/')
        shell: powershell
        run: |
          $version = node -p "require('./server/package.json').version"
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match server/package.json version $version"
          }

      - name: Build portable ZIP
        shell: powershell
        run: .\build-windows-release.ps1

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: kikoeru-windows-x64
          path: kikoeru-win-x64-*.zip
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify release tag matches product version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(node -p "require('./server/package.json').version")
          test "$GITHUB_REF_NAME" = "v$version"

      - name: Build portable archive
        run: ./build-linux-release.sh

      - name: Build container image
        run: docker build -t kikoeru:ci .

      - name: Publish container image
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag kikoeru:ci "$image:$GITHUB_REF_NAME"
          docker tag kikoeru:ci "$image:latest"
          docker push "$image:$GITHUB_REF_NAME"
          docker push "$image:latest"

      - name: Upload portable archive
        uses: actions/upload-artifact@v4
        with:
          name: kikoeru-linux-x64
          path: kikoeru-linux-x64-*.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - build-windows
      - build-linux
    runs-on: ubuntu-latest

    steps:
      - name: Download portable archives
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/* --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
